<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found – File Explorer</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#FDFBFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1A1C1E" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="notice">
    <img class="notice-mark" src="/favicon.svg" alt="" width="80" height="80">
    <h1 class="notice-title">Page not found</h1>
    <p class="notice-text">There’s no page at this address. Check the link, or start from the home page.</p>
    <a class="action" href="/">Go to the home page</a>
  </main>
</body>
</html>
